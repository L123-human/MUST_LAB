<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>REQ‑1.3 个性化推荐模块</title>
    <style>
        body { font-family:Arial,sans-serif; max-width:900px; margin:20px auto; padding:0 20px; }
        .form-block { border:1px solid #ccc; padding:16px; border-radius:8px; margin-bottom:20px; }
        .item { border:1px solid #888; padding:12px; margin:8px 0; border-radius:6px; }
        .no-result { color:#c00; background:#ffe9e9; padding:12px; border-radius:6px; }
        .reason-text { color:#2b549c; font-size:0.9em; }
        .reject-log { font-size:0.85em; color:#666; margin-top:6px; }
        button { padding:6px 12px; cursor:pointer; margin:0 4px; }
    </style>
</head>
<body>
    <h2>个性化推荐 REQ‑1.3</h2>

    <p>与主页面共用菜单；仅推荐可售且食材已核验的菜品。<a href="../docs/#favorites">收藏与反馈</a></p>
    <p id="feedback-status"></p>
    <div class="form-block">
        <h4>用户偏好设置</h4>
        <div>预算上限(留空=不限)：<input type="number" id="inpBudget" placeholder="例如30"></div>
        <div style="margin:6px 0;">排除食材(逗号分隔)：<input type="text" id="inpExclude" placeholder="香菜,花生"></div>
        <div>偏好口味(逗号分隔)：<input type="text" id="inpTaste" placeholder="清淡,高蛋白"></div>
        <br>
        <button onclick="runRecommend()">生成推荐</button>
    </div>

    <div>
        <h4>推荐结果：</h4>
        <div id="output"></div>
    </div>

<script src="../docs/menu.js"></script>
<script src="../docs/personal.js"></script>
<script src="../docs/personal-api.js"></script>
<script src="../docs/recommendation.js"></script>
<script>
let recommendationRequest = 0;
async function runRecommend(){
    const request = ++recommendationRequest;
    const budget = document.getElementById("inpBudget").value;
    const excludeRaw = document.getElementById("inpExclude").value;
    const tasteRaw = document.getElementById("inpTaste").value;

    const excludeIngredients = excludeRaw.split(",").map(s=>s.trim()).filter(s=>s);
    const preferredTastes = tasteRaw.split(",").map(s=>s.trim()).filter(s=>s);

    const prefs = {
        maxBudget: budget,
        excludeIngredients: excludeIngredients,
        preferredTastes: preferredTastes
    };

    let records = PersonalRecords.empty();
    let status = "游客模式：不读取个人反馈。";
    try {
        if (PersonalApi.active()) {
            records = await PersonalApi.read();
            status = "本地演示：使用此浏览器保存的反馈，共用设备可见。";
        }
    } catch (_) { status = "无法读取本地反馈，本次推荐未使用个人反馈。"; }
    if (request !== recommendationRequest) return;
    document.getElementById("feedback-status").textContent = status;
    const res = getRecommendation(DISHES, prefs, records);
    const outDom = document.getElementById("output");
    const escape = value => {
        const el = document.createElement("span");
        el.textContent = value;
        return el.innerHTML;
    };
    outDom.innerHTML = "";

    if(res.list.length === 0){
        let html = `<div class="no-result">没有匹配的推荐菜品</div>`;
        if(res.rejectReasons.length>0){
            html += `<div class="reject-log"><b>被筛除原因记录：</b><br>`;
            html += res.rejectReasons.map(escape).join("<br>");
            html += `</div>`;
        }
        outDom.innerHTML = html;
        return;
    }

    //渲染推荐列表
    res.list.forEach(item=>{
        let div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
            <div><b>${escape(item.name)}</b>｜ID:${item.id}｜价格：${Number.isFinite(item.price) ? item.price.toFixed(2) + "元" : "待确认"}｜分数:${item.score.toFixed(2)}</div>
            <div class="reason-text">💡推荐理由：${escape(item.reason)}</div>
        `;
        outDom.appendChild(div);
    });

    if(res.rejectReasons.length>0){
        const logDiv = document.createElement("div");
        logDiv.className = "reject-log";
        logDiv.innerHTML = `<br><b>本次被过滤菜品记录：</b><br>` + res.rejectReasons.map(escape).join("<br>");
        outDom.appendChild(logDiv);
    }
}
window.addEventListener("storage", event => {
    if (event.key === PersonalApi.storageKey || event.key === null) runRecommend();
});
runRecommend();
</script>
</body>
</html>
