<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 移动端优先，URS要求移动优先响应式网页 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Recommendation | Campus Canteen Dish System</title>
    <style>
        * {
            box-sizing: border-box;
            margin:0;
            padding:0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body{
            max-width:720px;
            margin:16px auto;
            padding:0 12px;
            background:#f7f8fa;
        }
        .container{
            background:#fff;
            border-radius:12px;
            padding:20px;
            margin-bottom:16px;
            box-shadow:0 1px 4px #00000014;
        }
        h1{
            font-size:20px;
            margin-bottom:16px;
            color:#222;
        }
        .form-row{
            margin:12px 0;
        }
        label{
            display:block;
            font-size:14px;
            margin-bottom:4px;
            color:#444;
        }
        input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:15px;
        }
        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }
        button:hover{
            background:#1d4ed8;
        }
        .dish-card{
            border:1px solid #e5e7eb;
            border-radius:10px;
            padding:14px;
            margin:10px 0;
        }
        .dish-name{
            font-weight:bold;
            font-size:16px;
        }
        .meta{
            font-size:13px;
            color:#555;
            margin:4px 0;
        }
        .reason{
            background:#eff6ff;
            padding:8px;
            border-radius:6px;
            font-size:13px;
            margin-top:8px;
            color:#1e40af;
        }
        .warning-tag{
            font-size:12px;
            color:#b45309;
            background:#fffbeb;
            padding:3px 6px;
            border-radius:4px;
            display:inline-block;
            margin:4px 0;
        }
        .no-result{
            padding:20px;
            text-align:center;
            color:#6b7280;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>REQ‑1.3 Personalized Recommendation</h1>
    <div class="form-row">
        <label>Max Budget (per dish)</label>
        <input id="budget" type="number" placeholder="e.g. 25" value="25">
    </div>
    <div class="form-row">
        <label>Excluded ingredients (comma‑separated)</label>
        <input id="excludeIngredients" type="text" placeholder="e.g. peanut,seafood" value="">
    </div>
    <div class="form-row">
        <label>Preferred taste tags (comma‑separated)</label>
        <input id="preferTaste" type="text" placeholder="mild,spicy,savory" value="mild,savory">
    </div>
    <button id="getRecBtn">Get Personalized Recommendation</button>
</div>

<div class="container">
    <h1>Recommendation Result (Max 5)</h1>
    <div id="resultArea"></div>
</div>

<script>
// ========== Sample Dish Data（原型模拟菜品库，40‑60样本简化版）==========
const dishList = [
    {
        id:1, name:"Tomato Egg Rice", stall:"Stall‑A", price:18, portion:"Normal",
        tasteTags:["mild","savory"], ingredients:["tomato","egg","rice"],
        ingredientsVerified:true, available:true
    },
    {
        id:2, name:"Spicy Beef Noodle", stall:"Stall‑B", price:24, portion:"Large",
        tasteTags:["spicy","savory"], ingredients:["beef","chili","noodle"],
        ingredientsVerified:true, available:true
    },
    {
        id:3, name:"Mushroom Tofu Bowl", stall:"Stall‑A", price:16, portion:"Normal",
        tasteTags:["mild","fresh"], ingredients:["mushroom","tofu"],
        ingredientsVerified:true, available:true
    },
    {
        id:4, name:"Sweet Sour Pork", stall:"Stall‑C", price:28, portion:"Normal",
        tasteTags:["sweet","savory"], ingredients:["pork","vinegar"],
        ingredientsVerified:true, available:true
    },
    {
        id:5, name:"Unknown‑Ingredient Fried Rice", stall:"Stall‑B", price:17, portion:"Normal",
        tasteTags:["mild"], ingredients:[],
        ingredientsVerified:false, available:true
    },
    {
        id:6, name:"Garlic Vegetable", stall:"Stall‑A", price:12, portion:"Small",
        tasteTags:["mild","fresh"], ingredients:["vegetable","garlic"],
        ingredientsVerified:true, available:true
    },
    {
        id:7, name:"Chili Hot Pot Rice", stall:"Stall‑C", price:32, portion:"Large",
        tasteTags:["spicy"], ingredients:["chili","lamb"],
        ingredientsVerified:true, available:true
    }
];

/**
 * 【硬约束过滤 Hard Constraint Filter】REQ‑1.3 Processing
 * 规则：硬约束绝对不能违反；价格缺失就排除；未验证食材不直接过滤，打警告标签
 */
function hardConstraintFilter(dishes, preference){
    const excludeArr = preference.excludeIngredients.split(',').map(s=>s.trim().toLowerCase()).filter(s=>s);
    return dishes.filter(dish=>{
        // 1.价格存在并且不超过预算；没有价格直接排除
        if(dish.price === undefined || dish.price > preference.maxBudget){
            return false;
        }
        // 2.菜品不可用直接排除
        if(!dish.available) return false;
        // 3.食材已经验证：检查是否包含被排除食材
        if(dish.ingredientsVerified){
            const dishIngLower = dish.ingredients.map(i=>i.toLowerCase());
            for(let ex of excludeArr){
                if(dishIngLower.includes(ex)) return false;
            }
        }
        // 未验证食材：不筛掉，保留，后续UI展示ingredients‑unknown警告
        return true;
    })
}

/**
 * 口味打分 score ，生成推荐理由
 */
function scoreAndGenerateReason(dish, preferTasteArr){
    let score = 0;
    const matchTags = [];
    for(let t of preferTasteArr){
        if(dish.tasteTags.includes(t)){
            score += 2;
            matchTags.push(t);
        }
    }
    let reasonParts = [];
    reasonParts.push(`Within your budget (${dish.price})`);
    if(matchTags.length>0){
        reasonParts.push(`Matches taste preference: ${matchTags.join(", ")}`);
    }
    if(!dish.ingredientsVerified){
        reasonParts.push("⚠ Ingredients unknown, please be careful");
    }
    return {score, reasonText: reasonParts.join("; ")}
}

/**
 * 主推荐入口函数
 */
function getRecommendation(preference){
    const preferTasteArr = preference.preferTaste.split(',').map(s=>s.trim()).filter(s=>s);
    // Step1：硬约束过滤
    let candidates = hardConstraintFilter(dishList, preference);
    // Step2：打分排序
    const scored = candidates.map(dish=>{
        const {score, reasonText} = scoreAndGenerateReason(dish, preferTasteArr);
        return {dish, score, reasonText}
    })
    scored.sort((a,b)=> b.score - a.score);
    // Step3：最多返回5条（URS REQ‑1.3 constraint）
    const top5 = scored.slice(0,5);
    return top5;
}

// 渲染页面
function renderResult(list){
    const area = document.getElementById("resultArea");
    area.innerHTML = "";
    if(list.length ===0){
        area.innerHTML = `
        <div class="no-result">
            <h3>No matching dishes</h3>
            <p>No dish satisfies all hard‑constraint conditions.</p>
            <p>Please modify your budget or excluded ingredients and retry.</p>
        </div>`;
        return;
    }
    list.forEach(item=>{
        const d = item.dish;
        const card = document.createElement("div");
        card.className = "dish-card";
        card.innerHTML = `
            <div class="dish-name">${d.name}</div>
            <div class="meta">Stall:${d.stall}｜Price:${d.price}｜Portion:${d.portion}</div>
            ${!d.ingredientsVerified ? `<span class="warning-tag">ingredients unknown</span>` : ""}
            <div class="meta">Taste tags: ${d.tasteTags.join(", ")}</div>
            <div class="reason">💡 Recommend reason: ${item.reasonText}</div>
        `;
        area.appendChild(card);
    })
}

// 按钮事件
document.getElementById("getRecBtn").addEventListener("click", ()=>{
    const pref = {
        maxBudget: Number(document.getElementById("budget").value),
        excludeIngredients: document.getElementById("excludeIngredients").value,
        preferTaste: document.getElementById("preferTaste").value
    }
    const recList = getRecommendation(pref);
    renderResult(recList);
})
</script>
</body>
</html>
