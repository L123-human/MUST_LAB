<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>REQ‑1.3 个性化推荐模块</title>
    <style>
        body { font-family:Arial,sans-serif; max-width:900px; margin:20px auto; padding:0 20px; }
        .form-block { border:1px solid #ccc; padding:16px; border-radius:8px; margin-bottom:20px; }
        .item { border:1px solid #888; padding:12px; margin:8px 0; border-radius:6px; }
        .no-result { color:#c00; background:#ffe9e9; padding:12px; border-radius:6px; }
        .reason-text { color:#2b549c; font-size:0.9em; }
        .reject-log { font-size:0.85em; color:#666; margin-top:6px; }
        button { padding:6px 12px; cursor:pointer; margin:0 4px; }
    </style>
</head>
<body>
    <h2>个性化推荐 REQ‑1.3</h2>

    <div class="form-block">
        <h4>用户偏好设置</h4>
        <div>预算上限(留空=不限)：<input type="number" id="inpBudget" placeholder="例如30"></div>
        <div style="margin:6px 0;">排除食材(逗号分隔)：<input type="text" id="inpExclude" placeholder="香菜,花生"></div>
        <div>偏好口味(逗号分隔)：<input type="text" id="inpTaste" placeholder="辣,鲜"></div>
        <br>
        <button onclick="runRecommend()">生成推荐</button>
    </div>

    <div>
        <h4>推荐结果：</h4>
        <div id="output"></div>
    </div>

<script>
// ====================== 模拟菜品数据库 ======================
const sampleDishes = [
    {id:1, dishId:"D001", name:"辣子鸡", price:28, tastes:["辣","咸香"], verified:true, stall:0, available:true, ingredients:["鸡肉","干辣椒"]},
    {id:2, dishId:"D002", name:"清蒸鲈鱼", price:32, tastes:["鲜"], verified:false, stall:1, available:true, ingredients:["鲈鱼","姜"]},
    {id:3, dishId:"D003", name:"麻婆豆腐", price:18, tastes:["辣","咸"], verified:true, stall:0, available:true, ingredients:["豆腐","辣椒"]},
    {id:4, dishId:"D004", name:"糖醋排骨", price:35, tastes:["甜"], verified:true, stall:2, available:false, ingredients:["排骨","糖"]},
    {id:5, dishId:"D005", name:"番茄炒蛋", price:15, tastes:["鲜","甜"], verified:true, stall:1, available:true, ingredients:["番茄","鸡蛋"]},
    {id:6, dishId:"D006", name:"水煮牛肉", price:33, tastes:["辣"], verified:true, stall:0, available:true, ingredients:["牛肉","辣椒"]},
    {id:7, dishId:"D007", name:"白灼菜心", price:12, tastes:["鲜"], verified:true, stall:3, available:true, ingredients:["菜心"]},
    {id:8, dishId:"D008", name:"宫保鸡丁", price:26, tastes:["辣","咸香"], verified:true, stall:0, available:true, ingredients:["鸡肉","花生"]}
];

// 收藏反馈模拟：key=dishId，值：'liked' / 'notInterested' / null
let feedback = {
    "D001":"liked",
    "D008":"notInterested"
};

// ====================== 核心推荐函数 REQ‑1.3 ======================
function getRecommendation(dishes, prefs, feedbackObj){
    const rejectReasons = [];
    const {maxBudget, excludeIngredients=[], preferredTastes=[]} = prefs;

    // 1.硬约束过滤
    let candidates = dishes.filter(dish=>{
        if(!dish.available){
            rejectReasons.push(`【${dish.name}】菜品暂不可供应`);
            return false;
        }
        if(dish.verified !== true){
            rejectReasons.push(`【${dish.name}】配料未验证，已过滤`);
            return false;
        }
        const hasBanIng = excludeIngredients.some(ing=> dish.ingredients.includes(ing));
        if(hasBanIng){
            rejectReasons.push(`【${dish.name}】包含被排除食材`);
            return false;
        }
        if(maxBudget !== "" && maxBudget != null){
            const b = Number(maxBudget);
            if(!isNaN(b) && dish.price > b){
                rejectReasons.push(`【${dish.name}】超出预算`);
                return false;
            }
        }
        return true;
    });

    // 2.打分+生成推荐理由
    candidates = candidates.map(dish=>{
        let score = 0;
        const matchTaste = dish.tastes.filter(t=> preferredTastes.includes(t));
        score += matchTaste.length;

        const fb = feedbackObj[dish.dishId];
        let feedbackRank;
        if(fb === "liked"){ score +=1.5; feedbackRank=0; }
        else if(fb === "notInterested"){ score -=1.5; feedbackRank=2; }
        else { feedbackRank=1; }

        let reason = "";
        if(matchTaste.length>0){
            reason = `匹配口味：${matchTaste.join("、")}`;
        }else{
            reason = "符合筛选条件，无口味匹配";
        }
        if(fb==="liked") reason += "；你标记过喜欢该菜品";
        if(fb==="notInterested") reason += "；你标记过不感兴趣";

        return {...dish, score, feedbackRank, reason};
    });

    //3.排序：分数降序 → feedbackRank升序 → dishId升序
    candidates.sort((a,b)=>{
        if(b.score !== a.score) return b.score - a.score;
        if(a.feedbackRank !== b.feedbackRank) return a.feedbackRank - b.feedbackRank;
        return String(a.dishId).localeCompare(String(b.dishId));
    });

    const list = candidates.slice(0,5);
    return {list, rejectReasons};
}

// ====================== 页面交互逻辑 ======================
function runRecommend(){
    const budget = document.getElementById("inpBudget").value;
    const excludeRaw = document.getElementById("inpExclude").value;
    const tasteRaw = document.getElementById("inpTaste").value;

    const excludeIngredients = excludeRaw.split(",").map(s=>s.trim()).filter(s=>s);
    const preferredTastes = tasteRaw.split(",").map(s=>s.trim()).filter(s=>s);

    const prefs = {
        maxBudget: budget,
        excludeIngredients: excludeIngredients,
        preferredTastes: preferredTastes
    };

    const res = getRecommendation(sampleDishes, prefs, feedback);
    const outDom = document.getElementById("output");
    outDom.innerHTML = "";

    if(res.list.length === 0){
        let html = `<div class="no-result">没有匹配的推荐菜品</div>`;
        if(res.rejectReasons.length>0){
            html += `<div class="reject-log"><b>被筛除原因记录：</b><br>`;
            html += res.rejectReasons.join("<br>");
            html += `</div>`;
        }
        outDom.innerHTML = html;
        return;
    }

    //渲染推荐列表
    res.list.forEach(item=>{
        let div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
            <div><b>${item.name}</b>｜ID:${item.dishId}｜价格：${item.price}元｜分数:${item.score.toFixed(2)}</div>
            <div class="reason-text">💡推荐理由：${item.reason}</div>
        `;
        outDom.appendChild(div);
    });

    if(res.rejectReasons.length>0){
        const logDiv = document.createElement("div");
        logDiv.className = "reject-log";
        logDiv.innerHTML = `<br><b>本次被过滤菜品记录：</b><br>` + res.rejectReasons.join("<br>");
        outDom.appendChild(logDiv);
    }
}
</script>
</body>
</html>
